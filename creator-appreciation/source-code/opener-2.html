<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{background:#e9e3d8}
.lbl{position:absolute;font-family:'Space Mono';font-size:20px;color:#5d5850;text-align:center;line-height:1.3}
.intro{position:absolute;left:60px;top:150px;width:600px;font-family:'Space Grotesk';color:#17130f}
.intro .rule{font-family:'Space Mono';font-size:21px;color:#6b665d;letter-spacing:.01em;margin-bottom:26px}
.intro h1{font-weight:600;font-size:58px;letter-spacing:-.028em;line-height:1.02}
.intro p{margin-top:16px;font-size:27px;line-height:1.32;color:#4a453e}
</style></head><body><div class="canvas" id="c"></div>
<script src="assets/data.js"></script><script src="lib.js"></script>
<script>
const c=document.getElementById('c');
const H=HUE['b4-solved'].tiles;
const W=178, TH=1000, BOT=1296, gap=40, x0=1080-60-5*W-4*gap+W+gap; // five tubes, right-aligned; first tube partly off-page
const xs=[0,1,2,3,4].map(i=>56+i*(W+gap));
const rim='#8a9199', glass='#d6cfc3';
const cap=TH-W*.12, n=8, bh=(TH-10)/n;
// 1 · Hue: the solved board's first column, pink at the top falling to teal at the bottom (real tiles, fixed dots kept)
const hue=[...H.map(r=>r[0])].reverse().map(t=>({h:bh,bg:t.hex,html:t.fixed?'<i style="width:10px;height:10px;border-radius:50%;background:rgba(15,15,18,.5)"></i>':''}));
// 2 · Solo Chess: one file of the board, light/dark alternating, the king alone on his square
const chess=[...Array(n)].map((_,i)=>({h:bh,bg:i%2?'#f0d8b5':'#b48862',html:i===5?'<img src="assets/pieces/wK.svg" style="width:118px;height:118px">':''}));
// 3 · Quantum Tic Tac Toe: night-sky cells, the moves in the order they were played
const q=[['X',1],['O',2],['X',3],['O',4],['X',5],['O',6],['X',7],['O',8]];
const qt=q.map(([ch,k],i)=>({h:bh,bg:i%2?'#141a2f':'#191f38',html:`<div style="padding-right:12px">${qhtml(ch,k,62,ch==='X'?'#1fcce8':'#f070b4')}</div>`}));
// 4 · Water Sort: its own rule, kept: one colour, one shape
const ws=[...Array(4)].map(()=>({h:(TH-10)/4,bg:PAL.watersort.orange,html:'<span style="font-family:DejaVu Sans;font-size:30px;color:rgba(0,0,0,.35)">✚</span>'}));
const sets=[hue,chess,qt,ws,[]];
sets.forEach((b,i)=>glassTube(c,{x:xs[i]+(i===0?0:0),y:BOT-TH,w:W,h:TH,rim,glass,lw:5,bands:b,lift:0}));
['hue','solo chess','quantum tic tac toe','water sort','+22 more'].forEach((t,i)=>c.insertAdjacentHTML('beforeend',`<div class="mono abs" style="left:${xs[i]+W-34}px;top:${BOT-TH+26}px;transform:rotate(90deg);transform-origin:0 0;font-size:18px;white-space:nowrap;color:${i===2?'rgba(255,255,255,.55)':'rgba(20,16,14,.55)'}">${t}</div>`));
c.insertAdjacentHTML('beforeend',`<div class="intro" style="top:132px;width:960px"><h1>Meet Bhasker Goel.</h1><p>He’s made 26 Bits on Plethora. We sorted four of them his way: every colour in a tube of its own.</p></div>`);
const wm=wordmark(4.6,'#17130f');wm.style.cssText='position:absolute;left:60px;top:58px';c.appendChild(wm);
</script></body></html>
