<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{background:#ece4d6}
.sheet{position:absolute;left:0;right:0;top:900px;bottom:-40px;background:#0f0f11;border-radius:52px 52px 0 0}
.sh-hd{position:absolute;left:56px;right:56px;top:938px;display:flex;justify-content:space-between;font-family:'Space Mono';font-size:25px;color:#f1ece2}
.sh-hd span{color:#77767c}
.rule{position:absolute;left:0;right:0;top:1000px;height:1px;background:#2a2a2f}
.intro{position:absolute;left:56px;top:1040px;width:960px;color:#f1ece2;font-family:'Space Grotesk'}
.intro h1{font-weight:600;font-size:60px;letter-spacing:-.025em;line-height:1}
.intro p{margin-top:18px;font-size:30px;line-height:1.32;color:#a9a8ae;max-width:820px}
.intro p b{color:#f1ece2;font-weight:500}
</style></head><body><div class="canvas" id="c">
<div class="sheet"></div>
<div class="sh-hd"><div>@furiouslad23 <span>/</span> drops</div><div><span>26 bits</span></div></div>
<div class="rule"></div>
<div class="intro"><h1>Meet Bhasker Goel.</h1><p>He makes Bits on Plethora. We’ve been playing them, <b>and we’ve been losing to some of them.</b></p></div>
</div>
<script src="assets/data.js"></script><script src="lib.js"></script>
<script>
const c=document.getElementById('c'); const E=900; // shelf edge
const H=HUE['b4-solved'].tiles;
// Hue: real tiles from the solved board's top row (pink → cream), fixed tiles keep their dot; the top one sits askew
const stack=[[H[0][0],0,0],[H[0][3],0,0],[H[0][6],-7,10]];
stack.forEach(([t,rot,dx],i)=>{const s=150;const d=document.createElement('div');
  d.style.cssText=`position:absolute;left:${56+dx}px;top:${E-(i+1)*s}px;width:${s}px;height:${s}px;background:${t.hex};transform:rotate(${rot}deg);transform-origin:0 100%`;
  if(t.fixed||i!==1){const k=document.createElement('i');k.style.cssText='position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:rgba(20,16,18,.55)';d.appendChild(k)}
  c.appendChild(d);});
// Quantum Tic Tac Toe: X1 balanced on the Hue stack, O2 on the shelf, joined by the game's amber line
qmark(c,{x:78,y:E-3*150-128,size:118,ch:'X',n:1,color:'#14aecb'});
qmark(c,{x:520,y:E-232,size:236,ch:'O',n:2,color:'#f070b4'});
const sv=el('svg',{width:1080,height:1350,style:'position:absolute;left:0;top:0;pointer-events:none'});c.appendChild(sv);
el('path',{d:`M${78+36},${E-3*150-82} C${300},${E-760} ${520},${E-520} ${520+78},${E-140}`,fill:'none',stroke:'#e9a93b','stroke-width':9,'stroke-linecap':'round'},sv);
// Solo Chess: the king, standing on the shelf
piece(c,{x:228,y:E-300*.955,size:300,p:'wK'});
// Water Sort: one solved tube, and one giant unsolved tube (puzzle 5, first tube, as dealt) holding up the page
tube(c,{x:760,y:E-440,w:100,h:440,segs:['yellow','yellow','yellow','yellow'],rim:'#7f868e',glass:'#d9d2c4',lw:4});
tube(c,{x:886,y:-80,w:170,h:E+80,segs:['yellow','blue','red','green'],rim:'#7f868e',glass:'#d9d2c4',lw:5});
const wm=wordmark(5,'#17130f');wm.style.cssText='position:absolute;left:56px;top:62px';c.appendChild(wm);
</script></body></html>
