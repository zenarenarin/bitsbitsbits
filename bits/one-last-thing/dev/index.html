<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONE LAST THING dev harness</title>
<style>
  html,body{margin:0;height:100%;background:#222;overflow:hidden}
  #bit{position:absolute;inset:0;overflow:hidden;touch-action:none}
</style>
</head>
<body>
<div id="bit"></div>
<script>window.__OLT_DEV = true;</script>
<script src="../main.js"></script>
<script type="module">
// A small stand-in for the Plethora runtime, covering what the Bit uses.
const host = document.getElementById('bit');
const cleanups = [];
const store = JSON.parse(localStorage.getItem('olt-dev-store') || '{}');
const q = new URLSearchParams(location.search);
const safe = q.has('frame') ? { top: 0, bottom: 120, left: 0, right: 0 } : { top: 62, bottom: 34, left: 0, right: 0 };
const LAYERS = { background: 0, content: 10, overlay: 20, modal: 30 };
function place(el, o) { o = o || {}; el.style.zIndex = String((LAYERS[o.layer] ?? 10) + (o.order || 0)); if (o.input === 'passthrough') el.style.pointerEvents = 'none'; }
window.__events = [];
const ctx = {
  get width() { return host.clientWidth; },
  get height() { return host.clientHeight; },
  dpr: Math.min(3, window.devicePixelRatio || 1),
  nativeDpr: window.devicePixelRatio || 1,
  safeArea: safe,
  contentSafeArea: q.has('frame') ? undefined : { top: 62, bottom: 108, left: 0, right: 0 },
  capabilities: { audio: true, backgroundMusic: false, haptics: true, storage: true },
  container: host,
  createCanvas2D(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%'; place(c, opts); host.appendChild(c); if (opts && opts.coordinateSpace === 'css') { c.width = host.clientWidth; c.height = host.clientHeight; } return c; },
  createCanvas(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;touch-action:none'; place(c, opts); host.appendChild(c); return c; },
  createRoot(opts) { const d = document.createElement('div'); d.className = (opts && opts.className) || ''; d.style.cssText = 'position:absolute;inset:0;' + ((opts && opts.style) || ''); place(d, opts); host.appendChild(d); return d; },
  listen(t, ev, fn, o) { t.addEventListener(ev, fn, o); cleanups.push(() => t.removeEventListener(ev, fn, o)); return () => t.removeEventListener(ev, fn, o); },
  onResize(cb, o) { const f = () => cb({ width: ctx.width, height: ctx.height }); window.addEventListener('resize', f); if (o && o.immediate) f(); },
  timeout(fn, ms) { setTimeout(fn, ms); },
  interval(fn, ms) { setInterval(fn, ms); },
  onDestroy(fn) { cleanups.push(fn); },
  markVisualReady(r) { window.__visualReady = r; },
  async importModule(name, version) { return await import('./vendor/three.module.js'); },
  async loadFont() { return null; },
  storage: { get: k => (k in store ? store[k] : null), set: (k, v) => { store[k] = v; localStorage.setItem('olt-dev-store', JSON.stringify(store)); } },
  platform: { error(p) { window.__platformError = p; }, ready() { window.__ready = true; }, start(p) { __events.push(['start', p]); }, interact() {}, milestone(n, p) { __events.push(['milestone', n, p]); }, fail(p) { __events.push(['fail', p]); }, complete(p) { __events.push(['complete', p]); }, haptic() {}, setScore() {}, emit() {} },
  pulse: { complete(p) { __events.push(['pulse', p]); } },
  memory: { record(id) { return { submit: async v => { __events.push(['record', id, v]); return { submitted: true }; }, rank: async () => ({ viewerRank: { rank: 3 }, totalRanked: 41 }) }; } },
  game: {
    loop(o) { let last = performance.now(); const f = t => { o.update && o.update(Math.min(100, t - last)); o.render && o.render(); last = t; requestAnimationFrame(f); }; requestAnimationFrame(f); return {}; },
    progress: { load: async () => ({ resumeEligible: false }), save: async () => ({}) },
  }
};
window.__ctx = ctx;
window.plethoraBit.init(ctx).catch(e => { console.error(e); window.__initError = String(e && e.stack || e); });
</script>
</body>
</html>
