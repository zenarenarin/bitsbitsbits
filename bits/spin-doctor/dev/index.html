<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPIN DOCTOR dev harness</title>
<style>
  html,body{margin:0;height:100%;background:#222;overflow:hidden}
  #bit{position:absolute;inset:0;overflow:hidden;touch-action:none}
</style>
</head>
<body>
<div id="bit"></div>
<script>window.__SD_DEV = true;</script>
<script src="../main.js"></script>
<script type="module">
// A small stand-in for the Plethora runtime, covering only what SPIN DOCTOR uses.
const host = document.getElementById('bit');
const cleanups = [];
const Z = { background: 0, content: 1, overlay: 2, modal: 3 };
const place = (el, o) => { if (o && o.layer) el.style.zIndex = String(Z[o.layer]); if (o && (o.input === 'passthrough' || o.pointerEvents === 'none')) el.style.pointerEvents = 'none'; return el; };
const store = (()=>{try{return JSON.parse(localStorage.getItem('sdstore')||'{}')}catch(e){return {}}})();
const ctx = {
  get width() { return host.clientWidth; },
  get height() { return host.clientHeight; },
  dpr: Math.min(2, window.devicePixelRatio || 1),
  nativeDpr: window.devicePixelRatio || 1,
  safeArea: { top: 62, bottom: 34, left: 0, right: 0 },
  contentSafeArea: { top: 62, bottom: 108, left: 0, right: 0 },
  capabilities: { audio: true, backgroundMusic: false, haptics: true, storage: true },
  container: host,
  createCanvas2D(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;pointer-events:none'; host.appendChild(c); return c; },
  createCanvas(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;touch-action:none'; host.appendChild(c); return place(c, opts); },
  createRoot(opts) { const d = document.createElement('div'); d.className = (opts && opts.className) || ''; d.style.cssText = 'position:absolute;inset:0;pointer-events:none'; host.appendChild(d); return place(d, opts); },
  listen(t, ev, fn, o) { t.addEventListener(ev, fn, o); cleanups.push(() => t.removeEventListener(ev, fn, o)); },
  onResize(cb, o) { const f = () => cb({ width: ctx.width, height: ctx.height, dpr: ctx.dpr, nativeDpr: ctx.nativeDpr, safeArea: ctx.safeArea }); window.addEventListener('resize', f); if (o && o.immediate) f(); },
  timeout(fn, ms) { return setTimeout(fn, ms); },
  onDestroy(fn) { cleanups.push(fn); },
  onFrame(cb) { let last = performance.now(); const loop = t => { cb(t - last, t); last = t; requestAnimationFrame(loop); }; requestAnimationFrame(loop); },
  markVisualReady(r) { window.__visualReady = r; },
  async importModule(name, version) { if (location.search.includes('failthree') && !window.__failedOnce) { window.__failedOnce = true; throw new Error('simulated download failure'); } return await import('./vendor/three.module.js'); },
  async loadFont(family, name, version, o) { const f = new FontFace(family, `url(./vendor/${name}-${o.weight}${o.style==='italic'?'-italic':''}.ttf)`, { weight: o.weight, style: o.style }); await f.load(); document.fonts.add(f); return f; },
  storage: { get: k => (k in store ? JSON.parse(store[k]) : null), set: (k, v) => { store[k] = JSON.stringify(v); try{localStorage.setItem('sdstore',JSON.stringify(store))}catch(e){} } },
  music: { unlock: async () => {}, play: () => ({}), sting: () => Promise.resolve() },
  platform: { haptic(k){ (window.__haptics=window.__haptics||[]).push(k); }, error(p) { window.__platformError = p; }, ready() { window.__ready = true; }, start() {}, interact() {}, milestone() {}, fail(p) { window.__failed = p; }, complete() {}, setScore() {}, emit() {} },
  game: {
    loop(o) { window.__loopUpdate = o.update; if (location.search.includes('manual')) return {}; let last = performance.now(); const f = t => { o.update && o.update(Math.min(100, t - last)); last = t; requestAnimationFrame(f); }; requestAnimationFrame(f); return {}; },
    score() { let v = 0; return { set: x => { v = x; window.__hostScore = v; }, reset: () => { v = 0; }, submit: async () => { window.__submitted = (window.__submitted||0)+1; window.__submittedValue = v; return { submitted: true, standing: { rank: 3, totalRanked: 120 } }; }, leaderboard: async () => ({ rows: [{ rank: 1, username: 'mira.k', value: 48210, userId: 'a' }, { rank: 2, username: 'tobias', value: 31975, userId: 'b' }, { rank: 3, username: 'you', value: v, userId: 'me' }], viewerRank: { rank: 3, userId: 'me' }, totalRanked: 120 }), get value() { return v; } }; }
  }
};
window.__ctx = ctx;
window.plethoraBit.init(ctx).catch(e => { console.error(e); window.__initError = String(e && e.stack || e); });
</script>
</body>
</html>
