<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}#bit{position:fixed;inset:0;overflow:hidden}</style></head>
<body><div id="bit"></div>

  container,
  get width() { return container.clientWidth; }, get height() { return container.clientHeight; },

  createRoot(o) { const d = document.createElement('div'); d.style.cssText = 'position:absolute;inset:0;z-index:5;' + (o && o.input === 'passthrough' ? 'pointer-events:none;' : ''); if (o && o.className) d.className = o.className; container.appendChild(d); return d; },

</script></body></html>
