<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE REFLECTION dev harness</title>
<style>
  html,body{margin:0;height:100%;background:#222;overflow:hidden}
  #bit{position:absolute;inset:0;overflow:hidden;touch-action:none}
</style>
</head>
<body>
<div id="bit"></div>
<div id="logo" style="position:absolute;display:none;border-radius:50%;background:rgba(255,255,255,.85);pointer-events:none;z-index:99"></div>
<script>window.__REFLECTION_DEV = true;</script>
<script src="../main.js"></script>
<script type="module">
// A small stand-in for the Plethora runtime, covering only what the Bit uses.
const host = document.getElementById('bit');
const cleanups = [];
const store = {};
const ctx = {
  get width() { return host.clientWidth; },
  get height() { return host.clientHeight; },
  dpr: Math.min(2, window.devicePixelRatio || 1),
  nativeDpr: window.devicePixelRatio || 1,
  // ?fullscreen emulates a full-screen Bit on an iPhone 17 Pro, logo button included
  safeArea: location.search.includes('fullscreen') ? { top: 62, right: 0, bottom: 34, left: 0 } : { top: 0, bottom: 120, left: 0, right: 0 },
  contentSafeArea: location.search.includes('fullscreen') ? { top: 62, right: 0, bottom: 108.5, left: 0 } : undefined,
  get logoArea() { return location.search.includes('fullscreen') ? { x: host.clientWidth / 2 - 28, y: host.clientHeight - 34 - 64, width: 56, height: 56 } : undefined; },
  input: { activate(el, fn) { el.addEventListener('click', fn); cleanups.push(() => el.removeEventListener('click', fn)); } },
  tune: { number(id) { const m = { response_window: 1, takeover_seconds: 20, feint_rate: 1, camera_shake: 1, mirror_distortion: 1 }; return m[id]; } },
  pulse: { complete(o) { window.__pulse = o; } },
  capabilities: { audio: true, backgroundMusic: true, haptics: true, storage: true },
  container: host,
  createCanvas2D(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;pointer-events:none'; host.appendChild(c); return c; },
  createCanvas(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;touch-action:none'; host.appendChild(c); return c; },
  createRoot(opts) { const d = document.createElement('div'); d.className = (opts && opts.className) || ''; d.style.cssText = 'position:absolute;inset:0;pointer-events:none'; host.appendChild(d); return d; },
  listen(t, ev, fn, o) { t.addEventListener(ev, fn, o); cleanups.push(() => t.removeEventListener(ev, fn, o)); },
  onResize(cb, o) { const f = () => cb({ width: ctx.width, height: ctx.height, dpr: ctx.dpr, nativeDpr: ctx.nativeDpr, safeArea: ctx.safeArea }); window.addEventListener('resize', f); if (o && o.immediate) f(); },
  timeout(fn, ms) { return setTimeout(fn, ms); },
  onDestroy(fn) { cleanups.push(fn); },
  onFrame(cb) { let last = performance.now(); const loop = t => { cb(t - last, t); last = t; requestAnimationFrame(loop); }; requestAnimationFrame(loop); },
  markVisualReady(r) { window.__visualReady = r; },
  async importModule(name, version) { if (location.search.includes('failthree') && !window.__failedOnce) { window.__failedOnce = true; throw new Error('simulated download failure'); } return await import('./vendor/three.module.js'); },
  async loadFont() { return null; },
  storage: { get: k => (k in store ? JSON.parse(store[k]) : null), set: (k, v) => { store[k] = JSON.stringify(v); } },
  music: { unlock: async () => {}, play: () => ({}), sting: () => Promise.resolve() },
  platform: { error(p) { window.__platformError = p; }, ready() { window.__ready = true; }, start() {}, interact() {}, milestone() {}, fail(p) { window.__failed = p; }, complete() {}, haptic() {}, setScore() {}, emit() {} },
  game: {
    loop(o) { let last = performance.now(); const f = t => { o.update && o.update(Math.min(100, t - last)); last = t; requestAnimationFrame(f); }; requestAnimationFrame(f); return {}; },
    score() { let v = 0; return { set: x => { v = x; }, reset: () => { v = 0; }, submit: async () => ({ submitted: true }), leaderboard: async () => ({ rows: [{ rank: 1, value: 52310, displayLabel: '52,310 pts' }, { rank: 2, value: v, displayLabel: v.toLocaleString() + ' pts' }], viewerRank: { rank: 2 } }), get value() { return v; } }; }
  }
};
window.__ctx = ctx;
if (ctx.logoArea) { const l = ctx.logoArea, e = document.getElementById('logo'); Object.assign(e.style, { display: 'block', left: l.x + 'px', top: l.y + 'px', width: l.width + 'px', height: l.height + 'px' }); }
window.plethoraBit.init(ctx).catch(e => { console.error(e); window.__initError = String(e && e.stack || e); });
</script>
</body>
</html>
