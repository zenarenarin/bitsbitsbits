<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unstable Table dev harness</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden}
  #bit{position:absolute;inset:0;overflow:hidden;touch-action:none}
</style>
</head>
<body>
<div id="bit"></div>
<script>window.__UT_DEV = true; if (location.search.includes('seed')) window.__UT_SEED = 7;</script>
<script src="../main.js"></script>
<script type="module">
// A small stand-in for the Plethora runtime, covering what the Bit uses.
// ?safe=frame emulates the legacy safe frame (no contentSafeArea).
const host = document.getElementById('bit');
const store = {};
const legacy = location.search.includes('safe=frame');
const loops = [];
const ctx = {
  get width() { return host.clientWidth; },
  get height() { return host.clientHeight; },
  dpr: Math.min(2, window.devicePixelRatio || 1),
  nativeDpr: window.devicePixelRatio || 1,
  safeArea: legacy ? { top: 0, bottom: 120, left: 0, right: 0 } : { top: 62, bottom: 34, left: 0, right: 0 },
  contentSafeArea: legacy ? undefined : { top: 62, bottom: 108.5, left: 0, right: 0 },
  logoArea: legacy ? undefined : { x: host.clientWidth / 2 - 30, y: host.clientHeight - 90, width: 60, height: 60 },
  capabilities: { audio: true, backgroundMusic: true, haptics: true, storage: true },
  container: host,
  createCanvas2D(opts) {
    const c = document.createElement('canvas');
    c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;touch-action:none';
    host.appendChild(c);
    const dpr = Math.min(opts && opts.maxDpr || 1, window.devicePixelRatio || 1);
    const fit = () => { c.width = host.clientWidth * dpr; c.height = host.clientHeight * dpr; const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); };
    fit(); window.addEventListener('resize', fit);
    return c;
  },
  listen(t, ev, fn, o) { t.addEventListener(ev, fn, o); return () => t.removeEventListener(ev, fn, o); },
  onResize(cb, o) { const f = () => cb({ width: ctx.width, height: ctx.height }); window.addEventListener('resize', () => setTimeout(f, 0)); if (o && o.immediate) f(); },
  onDestroy(fn) {},
  markVisualReady(r) { window.__visualReady = r; },
  async loadScript(name, version) {
    if (location.search.includes('failplanck')) throw new Error('simulated planck failure');
    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = './vendor/planck.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  },
  async loadFont(family, name, version, o) {
    const f = new FontFace(family, `url(./vendor/${o.style === 'italic' ? 'dm400i' : 'dm400'}.ttf)`, { style: o.style, weight: o.weight });
    await f.load(); document.fonts.add(f); return f;
  },
  storage: { get: k => (k in store ? JSON.parse(store[k]) : null), set: (k, v) => { store[k] = JSON.stringify(v); } },
  music: { unlock: async () => {}, play: o => { window.__music = o; return { setIntensity(v) { window.__musicIntensity = v; }, stop() {} }; }, sting: n => { (window.__stings = window.__stings || []).push(n); return Promise.resolve(); }, stop() {} },
  platform: { error(p) { window.__platformError = p; }, ready() { window.__ready = true; }, start(p) { (window.__starts = window.__starts || []).push(p); }, interact() {}, milestone() {}, fail(p) { window.__failed = p; }, complete() {}, haptic(k) { (window.__haptics = window.__haptics || []).push(k); }, emit() {} },
  pulse: { complete(o) { window.__pulse = o; } },
  game: {
    loop(o) {
      let last = performance.now(), acc = 0, stopped = false;
      const step = 1000 / (o.fixedHz || 60);
      const f = t => {
        if (stopped) return;
        let dt = Math.min(80, t - last); last = t;
        if (!window.__paused) {
          acc += dt; let n = 0;
          while (acc >= step && n < (o.maxSubsteps || 4)) { o.fixedUpdate && o.fixedUpdate(step); acc -= step; n++; }
          if (n >= (o.maxSubsteps || 4)) acc = 0;
          o.render && o.render(acc / step);
        }
        requestAnimationFrame(f);
      };
      requestAnimationFrame(f);
      const h = { stop() { stopped = true; } }; loops.push(h); return h;
    },
    score() {
      let v = 0;
      return { set: x => { v = x; }, reset: () => { v = 0; }, get value() { return v; },
        submit: async (ch, o) => { window.__submitted = { v, o }; return { submitted: true }; },
        leaderboard: async () => ({ rows: [{ rank: 1, value: 4200, displayName: 'ochre_fox' }, { rank: 2, value: 3100, displayName: 'tessellate' }, { rank: 3, value: Math.max(v, 900), displayName: 'you' }], viewerRank: { rank: 3 } }) };
    }
  }
};
window.__ctx = ctx;
window.plethoraBit.init(ctx).catch(e => { console.error(e); window.__initError = String(e && e.stack || e); });
</script>
</body>
</html>
