<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORBIT dev harness</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden}
  #bit{position:absolute;inset:0;overflow:hidden}
  #logo{position:absolute;left:50%;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:rgba(255,255,255,.18);pointer-events:none;z-index:99999}
</style>
</head>
<body>
<div id="bit"></div>
<div id="logo"></div>
<script>window.__ORBIT_DEV = true;</script>
<script src="../main.js"></script>
<script>
// A small stand-in for the Plethora runtime covering what ORBIT uses.
// ?safe=top,bottom  ?frame=legacy  ?seed=YYYY-MM-DD  ?nostore
(function () {
  const q = new URLSearchParams(location.search);
  const host = document.getElementById('bit');
  const logo = document.getElementById('logo');
  const legacy = q.get('frame') === 'legacy';
  const sa = (q.get('safe') || '62,34').split(',').map(Number);
  const log = window.__log = [];
  const rec = (k, v) => { log.push([k, v]); };
  const store = window.__store = window.__preStore ? JSON.parse(window.__preStore) : {};
  const cleanups = [];
  const layerZ = { background: 0, content: 100, overlay: 200, modal: 300 };
  function place(el, o) {
    o = o || {};
    if (o.layer) el.style.zIndex = String(layerZ[o.layer] + (o.order || 0));
    if (o.input === 'passthrough') el.style.pointerEvents = 'none';
    if (o.input === 'auto') el.style.pointerEvents = 'auto';
  }
  const ctx = {
    get width() { return host.clientWidth; },
    get height() { return host.clientHeight; },
    get dpr() { return window.devicePixelRatio || 1; },
    get nativeDpr() { return window.devicePixelRatio || 1; },
    get safeArea() { return legacy ? { top: 0, right: 0, bottom: 120, left: 0 } : { top: sa[0], right: 0, bottom: sa[1], left: 0 }; },
    get contentSafeArea() { return legacy ? undefined : { top: sa[0], right: 0, bottom: sa[1] + 74, left: 0 }; },
    get logoArea() { return legacy ? undefined : { x: host.clientWidth / 2 - 28, y: host.clientHeight - sa[1] - 66, width: 56, height: 56 }; },
    capabilities: { audio: true, backgroundMusic: true, haptics: true, storage: !q.has('nostore'), camera: false, microphone: false, motion: false },
    container: host,
    createCanvas2D(o) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%'; place(c, o); host.appendChild(c); return c; },
    createRoot(o) { const d = document.createElement('div'); d.className = (o && o.className) || ''; d.style.cssText = 'position:absolute;inset:0'; place(d, o); host.appendChild(d); return d; },
    surface: { place(el, o) { place(el, o); return el; }, enableInput(el) { el.style.pointerEvents = 'auto'; return el; } },
    input: { activate(t, fn) { t.style.pointerEvents = 'auto'; const h = e => fn(e); t.addEventListener('click', h); cleanups.push(() => t.removeEventListener('click', h)); return () => t.removeEventListener('click', h); } },
    listen(t, ev, fn, o) { t.addEventListener(ev, fn, o); const off = () => t.removeEventListener(ev, fn, o); cleanups.push(off); return off; },
    onResize(cb, o) { const f = () => cb({ width: ctx.width, height: ctx.height }); window.addEventListener('resize', f); if (o && o.immediate) f(); return () => window.removeEventListener('resize', f); },
    timeout(fn, ms) { setTimeout(fn, ms); },
    interval(fn, ms) { setInterval(fn, ms); },
    onDestroy(fn) { cleanups.push(fn); },
    onFrame(cb) { let last = performance.now(); const f = t => { cb(t - last, t); last = t; requestAnimationFrame(f); }; requestAnimationFrame(f); },
    markVisualReady(r) { rec('visualReady', r); },
    async loadFont(family, name, version, opts) { const ff = new FontFace(family, 'url(vendor/' + name + '.ttf)', opts || {}); await ff.load(); document.fonts.add(ff); rec('font', name); return ff; },
    storage: { get: k => (k in store ? JSON.parse(store[k]) : null), set: (k, v) => { store[k] = JSON.stringify(v); }, remove: k => { delete store[k]; } },
    memory: {
      local(id) { return { get: async () => ({ value: window.__cloud ? window.__cloud[id] || null : null, updatedAt: null }), set: async v => { window.__cloud = window.__cloud || {}; window.__cloud[id] = v; rec('local.set', id); return { value: v }; } }; },
      record(id) { return {
        submit: async (v, o) => { rec('record.submit', [id, v, o]); return { submitted: true, value: v }; },
        leaderboard: async () => ({ rows: [{ rank: 1, displayName: 'mira', value: 31000 }, { rank: 2, displayName: 'tomas', value: 38000 }, { rank: 3, displayName: 'ade', value: 44000 }], viewerRank: { rank: 14, value: 48000 }, totalRanked: 230 }),
        rank: async () => ({ viewerRank: { rank: 14, value: 48000 }, totalRanked: 230 }) }; }
    },
    music: { unlock: async () => {}, play: o => { rec('music.play', o); return {}; }, stop: () => {}, setIntensity: () => {}, duck: () => {}, sting: async () => {} },
    game: {
      loop(o) { let last = performance.now(); const f = t => { o.update && o.update(Math.min(80, t - last)); last = t; requestAnimationFrame(f); }; requestAnimationFrame(f); return {}; },
      stopwatch(o) { let base = (o && o.elapsedMs) || 0, t0 = 0, run = false; return { start() { if (!run) { run = true; t0 = performance.now(); } return true; }, pause() { if (run) { base += performance.now() - t0; run = false; } return true; }, get elapsedMs() { return base + (run ? performance.now() - t0 : 0); }, get running() { return run; }, reset(v) { base = v || 0; run = false; }, snapshot() { return { elapsedMs: this.elapsedMs, running: run }; }, destroy() {} }; },
      progress: { load: async () => ({ status: 'empty', resumeEligible: false }), save: async (c, p) => { rec('progress.save', [c, p && p.label]); return {}; }, complete: async c => { rec('progress.complete', c); return {}; }, abandon: async () => ({}) }
    },
    platform: { ready() { rec('ready', 1); window.__ready = true; }, start(p) { rec('start', p); }, interact() {}, milestone(n, p) { rec('milestone', [n, p]); }, complete(p) { rec('complete', p); }, fail() {}, error(p) { rec('error', p); console.warn('platform.error', JSON.stringify(p)); }, haptic(k) { rec('haptic', k); }, setScore() {}, emit() {} },
    pulse: { complete(o) { rec('pulse.complete', o); } },
    share(o) { rec('share', o); window.__shared = o; }
  };
  logo.style.top = (ctx.logoArea ? ctx.logoArea.y : host.clientHeight - 100) + 'px';
  window.__ctx = ctx;
  window.plethoraBit.init(ctx).catch(e => { console.error(e); window.__initError = String(e && e.stack || e); });
})();
</script>
</body>
</html>
