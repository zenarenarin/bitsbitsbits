<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Wind Keeps — dev harness</title>
<style>
  html,body{margin:0;height:100%;background:#222;overflow:hidden}
  #bit{position:absolute;inset:0;overflow:hidden;touch-action:none}
  #logo{position:absolute;left:50%;bottom:34px;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:rgba(0,0,0,.35);z-index:99999;pointer-events:none}
</style>
</head>
<body>
<div id="bit"></div>
<div id="logo"></div>
<script>window.__TWK_DEV = true;</script>
<script src="../main.js"></script>
<script type="module">
// A small stand-in for the Plethora runtime, covering only what The Wind Keeps uses.
const host = document.getElementById('bit');
const cleanups = [];
const store = {};
const local = JSON.parse(localStorage.getItem('twk-dev-local') || '{}');
const q = new URLSearchParams(location.search);
const top = +(q.get('top') || 62), bottom = +(q.get('bottom') || 34);
const scoreBoard = [];
const ctx = {
  get width() { return host.clientWidth; },
  get height() { return host.clientHeight; },
  dpr: Math.min(2, window.devicePixelRatio || 1),
  nativeDpr: window.devicePixelRatio || 1,
  safeArea: { top, bottom, left: 0, right: 0 },
  get contentSafeArea() { return { top, bottom: bottom + 74, left: 0, right: 0 }; },
  get logoArea() { return { x: host.clientWidth / 2 - 28, y: host.clientHeight - bottom - 56, width: 56, height: 56 }; },
  capabilities: { audio: true, backgroundMusic: true, haptics: true, storage: true },
  container: host,
  createCanvas2D(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;pointer-events:none'; host.appendChild(c); return c; },
  createCanvas(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;touch-action:none'; host.appendChild(c); return c; },
  createRoot(opts) { const d = document.createElement('div'); d.className = (opts && opts.className) || ''; d.style.cssText = 'position:absolute;inset:0;pointer-events:none'; host.appendChild(d); return d; },
  listen(t, ev, fn, o) { t.addEventListener(ev, fn, o); const off = () => t.removeEventListener(ev, fn, o); cleanups.push(off); return off; },
  onResize(cb, o) { const f = () => cb({ width: ctx.width, height: ctx.height, dpr: ctx.dpr, nativeDpr: ctx.nativeDpr, safeArea: ctx.safeArea, contentSafeArea: ctx.contentSafeArea }); window.addEventListener('resize', f); if (o && o.immediate) f(); return () => window.removeEventListener('resize', f); },
  timeout(fn, ms) { setTimeout(fn, ms); },
  onDestroy(fn) { cleanups.push(fn); },
  onFrame(cb) { let last = performance.now(); const loop = t => { cb(t - last, t); last = t; requestAnimationFrame(loop); }; requestAnimationFrame(loop); },
  markVisualReady(r) { window.__visualReady = r; },
  async importModule(name, version) { if (q.has('failthree')) throw new Error('simulated download failure'); return await import('./vendor/three.module.js'); },
  async loadFont() { return null; },
  storage: { get: k => (k in store ? JSON.parse(store[k]) : null), set: (k, v) => { store[k] = JSON.stringify(v); } },
  memory: {
    local(ch) { return {
      async get() { if (q.has('failmem')) throw new Error('memory offline'); return { value: local[ch] ?? null, updatedAt: null }; },
      async set(v) { local[ch] = v; localStorage.setItem('twk-dev-local', JSON.stringify(local)); return { value: v, updatedAt: new Date().toISOString() }; }
    }; },
    record(ch) { return {
      async submit(value, o) { scoreBoard.push({ value, label: o && o.label }); window.__submits = (window.__submits || 0) + 1; return { submitted: true, value, isPersonalBest: true }; },
      async leaderboard(o) { const rows = scoreBoard.slice().sort((a, b) => b.value - a.value).slice(0, (o && o.limit) || 3).map((r, i) => ({ rank: i + 1, value: r.value, displayLabel: r.label, username: i ? 'wanderer' + i : 'you' })); return { rows, viewerRank: rows.length ? { rank: 1, value: rows[0].value } : null, totalRanked: rows.length }; },
      async rank() { return { viewerRank: scoreBoard.length ? { rank: 1, value: Math.max(...scoreBoard.map(r => r.value)) } : null, totalRanked: scoreBoard.length }; }
    }; }
  },
  platform: { error(p) { window.__platformError = p; console.warn('platform.error', p); }, ready() { window.__ready = true; }, start() { window.__starts = (window.__starts || 0) + 1; }, interact() {}, milestone(n) { (window.__milestones = window.__milestones || []).push(n); }, fail() {}, complete(p) { window.__completes = (window.__completes || 0) + 1; }, haptic() {}, setScore() {}, setProgress() {}, emit() {} },
  pulse: { complete(o) { window.__pulse = o; } },
  game: {
    loop(o) { let last = performance.now(); const f = t => { o.update && o.update(Math.min(80, t - last)); last = t; requestAnimationFrame(f); }; requestAnimationFrame(f); return {}; },
    score() { let v = 0; return { set: x => { v = x; }, add: x => { v += x; }, reset: () => { v = 0; }, flush() {}, submit: async (ch, o) => ctx.memory.record(ch).submit(v, o), get value() { return v; } }; }
  }
};
window.__ctx = ctx;
window.plethoraBit.init(ctx).catch(e => { console.error(e); window.__initError = String(e && e.stack || e); });
</script>
</body>
</html>
