<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Last Light dev harness</title>
<style>
  html,body{margin:0;height:100%;background:#222;overflow:hidden}
  #bit{position:absolute;inset:0;overflow:hidden;touch-action:none}
  :root{--plethora-content-safe-top:62px;--plethora-content-safe-bottom:108px}
</style>
</head>
<body>
<div id="bit"></div>
<script>window.__LL_DEV = true;</script>
<script src="../main.js"></script>
<script type="module">
// A small stand-in for the Plethora runtime, covering only what the Bit uses.
// Full-screen insets of an iPhone-sized phone: island on top, logo below.
const host = document.getElementById('bit');
const store = {};
const q = new URLSearchParams(location.search);
const insets = q.has('frame') ? null : { top: 62, right: 0, bottom: 108, left: 0 };
const canvases = [];
const resizers = [];
const dprOf = () => Math.min(2, window.devicePixelRatio || 1);
function sizeCanvas(c) { c.width = Math.round(host.clientWidth * dprOf()); c.height = Math.round(host.clientHeight * dprOf()); }
const ctx = {
  get width() { return host.clientWidth; },
  get height() { return host.clientHeight; },
  get dpr() { return dprOf(); },
  nativeDpr: window.devicePixelRatio || 1,
  safeArea: insets ? { top: 62, right: 0, bottom: 34, left: 0 } : { top: 0, right: 0, bottom: 120, left: 0 },
  contentSafeArea: insets || undefined,
  logoArea: insets ? { x: 170, y: 800, width: 60, height: 60 } : undefined,
  capabilities: { audio: true, backgroundMusic: true, haptics: true, storage: true },
  container: host,
  createCanvas2D(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;touch-action:none'; sizeCanvas(c); canvases.push(c); host.appendChild(c); return c; },
  createRoot(opts) { const d = document.createElement('div'); d.className = (opts && opts.className) || ''; d.style.cssText = 'position:absolute;inset:0;pointer-events:none'; host.appendChild(d); return d; },
  listen(t, ev, fn, o) { t.addEventListener(ev, fn, o); },
  onResize(cb, o) { const f = () => { canvases.forEach(sizeCanvas); cb({ width: ctx.width, height: ctx.height, dpr: ctx.dpr }); }; window.addEventListener('resize', f); if (o && o.immediate) f(); },
  timeout(fn, ms) { setTimeout(fn, ms); },
  onDestroy(fn) {},
  markVisualReady(r) { window.__visualReady = r; },
  async loadFont() { return null; },
  storage: { get: k => (k in store ? JSON.parse(store[k]) : null), set: (k, v) => { store[k] = JSON.stringify(v); } },
  music: { unlock: async () => {}, play: () => ({}), pause() {}, resume() {}, stop() {}, setIntensity() {}, setTempo() {}, sting: () => Promise.resolve() },
  input: { activate(el, fn) { el.addEventListener('click', fn); } },
  pulse: { complete(o) { window.__pulse = o; } },
  platform: { error(p) { window.__platformError = p; console.error('platform.error', JSON.stringify(p)); }, ready() { window.__ready = true; }, start() { window.__starts = (window.__starts || 0) + 1; }, interact() {}, milestone() {}, fail(p) {}, complete(p) { window.__complete = p; }, haptic() {}, setProgress() {}, emit() {} },
  game: {
    loop(o) {
      let last = performance.now(), acc = 0; const step = 1000 / (o.fixedHz || 60);
      const f = t => { const d = Math.min(o.maxDeltaMs || 80, t - last); last = t; if (!window.__paused) { acc += d; let n = 0; while (acc >= step && n < 12) { o.fixedUpdate && o.fixedUpdate(step); acc -= step; n++; } o.update && o.update(d); } requestAnimationFrame(f); };
      requestAnimationFrame(f); return {};
    },
    score() { let v = 0; return { set: x => { v = x; }, reset: () => { v = 0; }, submit: async () => ({ submitted: true }), leaderboard: async () => ({ rows: [{ rank: 1, username: 'ink', displayLabel: '8,120 pts' }, { rank: 2, username: 'you', displayLabel: String(v) + ' pts' }], viewerRank: { rank: 2 }, totalRanked: 2 }), get value() { return v; } }; }
  }
};
window.__ctx = ctx;
window.plethoraBit.init(ctx).catch(e => { console.error(e); window.__initError = String(e && e.stack || e); });
</script>
</body>
</html>
