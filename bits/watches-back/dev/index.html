<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watches Back dev harness</title>
<style>
  html,body{margin:0;height:100%;background:#222;overflow:hidden}
  #bit{position:absolute;inset:0;overflow:hidden;touch-action:none}
</style>
</head>
<body>
<div id="bit"></div>
<script>window.__WTB_DEV = true;</script>
<script src="../main.js"></script>
<script type="module">
// A small stand-in for the Plethora runtime, covering only what this Bit uses.
const host = document.getElementById('bit');
const cleanups = [];
const store = {};
const ctx = {
  get width() { return host.clientWidth; },
  get height() { return host.clientHeight; },
  dpr: Math.min(2, window.devicePixelRatio || 1),
  nativeDpr: window.devicePixelRatio || 1,
  // a full-screen Bit on an iPhone: the island at the top, the logo button cleared at the bottom
  safeArea: { top: 62, bottom: 34, left: 0, right: 0 },
  contentSafeArea: { top: 62, bottom: 108.5, left: 0, right: 0 },
  logoArea: { x: 167, y: 770, width: 56, height: 44 },
  capabilities: { audio: true, backgroundMusic: true, haptics: true, storage: true },
  container: host,
  createCanvas2D(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;pointer-events:none'; host.appendChild(c); return c; },
  createCanvas(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;touch-action:none'; host.appendChild(c); return c; },
  createRoot(opts) { const d = document.createElement('div'); d.className = (opts && opts.className) || ''; d.style.cssText = 'position:absolute;inset:0;pointer-events:none'; host.appendChild(d); return d; },
  listen(t, ev, fn, o) { t.addEventListener(ev, fn, o); cleanups.push(() => t.removeEventListener(ev, fn, o)); },
  onResize(cb, o) { const f = () => cb({ width: ctx.width, height: ctx.height, dpr: ctx.dpr, nativeDpr: ctx.nativeDpr, safeArea: ctx.safeArea, contentSafeArea: ctx.contentSafeArea, logoArea: ctx.logoArea }); window.addEventListener('resize', f); if (o && o.immediate) f(); },
  timeout(fn, ms) { setTimeout(fn, ms); },
  onDestroy(fn) { cleanups.push(fn); },
  onFrame(cb) { let last = performance.now(); const loop = t => { if (!window.__noLoop) cb(t - last, t); last = t; requestAnimationFrame(loop); }; requestAnimationFrame(loop); },
  markVisualReady(r) { window.__visualReady = r; },
  async importModule(name, version) { if (location.search.includes('failthree') && !window.__failedOnce) { window.__failedOnce = true; throw new Error('simulated download failure'); } return await import('./vendor/three.module.js'); },
  async loadFont() { return null; },
  storage: { get: k => (k in store ? JSON.parse(store[k]) : null), set: (k, v) => { store[k] = JSON.stringify(v); } },
  music: { unlock: async () => {}, play: () => ({}), sting: () => Promise.resolve() },
  platform: { error(p) { window.__platformError = p; }, ready() { window.__ready = true; }, start() {}, interact() {}, milestone() {}, fail(p) { window.__failed = p; }, complete() {}, haptic() {}, setScore() {}, emit() {} },
  game: {
    loop(o) { let last = performance.now(); const f = t => { if (!window.__noLoop && o.update) o.update(Math.min(100, t - last)); last = t; requestAnimationFrame(f); }; requestAnimationFrame(f); return {}; },
    score() { let v = 0; return { set: x => { v = x; }, reset: () => { v = 0; }, submit: async () => ({ ok: true }), get value() { return v; } }; }
  }
};
window.__ctx = ctx;
window.plethoraBit.init(ctx).catch(e => { console.error(e); window.__initError = String(e && e.stack || e); });
</script>
</body>
</html>
