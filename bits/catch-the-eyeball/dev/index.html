<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CATCH THE EYEBALL dev harness</title>
<style>
  html,body{margin:0;height:100%;background:#222;overflow:hidden}
  #bit{position:absolute;inset:0;overflow:hidden;touch-action:none}
</style>
</head>
<body>
<div id="bit"></div>
<script>window.__CTE_DEV = true;</script>
<script src="../main.js"></script>
<script type="module">
// A small stand-in for the Plethora runtime, covering only what the game uses.
const host = document.getElementById('bit');
const cleanups = [];
const store = {};
const ctx = {
  get width() { return host.clientWidth; },
  get height() { return host.clientHeight; },
  dpr: Math.min(2, window.devicePixelRatio || 1),
  nativeDpr: window.devicePixelRatio || 1,
  safeArea: { top: 47, bottom: 34, left: 0, right: 0 },
  contentSafeArea: { top: 47, bottom: 108, left: 0, right: 0 },
  logoArea: null,
  pulse: { complete(o) { window.__pulse = o; } },
  capabilities: { audio: true, backgroundMusic: true, haptics: true, storage: true }, memory: { record: () => ({ submit: async () => ({ ok: true }) }) },
  container: host,
  createCanvas2D(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;pointer-events:none'; host.appendChild(c); return c; },
  createCanvas(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;touch-action:none'; host.appendChild(c); return c; },
  createRoot(opts) { const d = document.createElement('div'); d.className = (opts && opts.className) || ''; d.style.cssText = 'position:absolute;inset:0;pointer-events:none'; host.appendChild(d); return d; },
  listen(t, ev, fn, o) { t.addEventListener(ev, fn, o); cleanups.push(() => t.removeEventListener(ev, fn, o)); },
  onResize(cb, o) { const f = () => cb({ width: ctx.width, height: ctx.height, dpr: ctx.dpr, nativeDpr: ctx.nativeDpr, safeArea: ctx.safeArea }); window.addEventListener('resize', f); if (o && o.immediate) f(); },
  timeout(fn, ms) { return setTimeout(fn, ms); },
  onDestroy(fn) { cleanups.push(fn); },
  onFrame(cb) { let last = performance.now(); const loop = t => { cb(t - last, t); last = t; requestAnimationFrame(loop); }; requestAnimationFrame(loop); },
  markVisualReady(r) { window.__visualReady = r; },
  async importModule(name, version) { if (location.search.includes('failthree') && !window.__failedOnce) { window.__failedOnce = true; throw new Error('simulated download failure'); } return await import('./vendor/three.module.js'); },
  async loadFont() { return null; },
  storage: { get: k => (k in store ? JSON.parse(store[k]) : null), set: (k, v) => { store[k] = JSON.stringify(v); } },
  music: { unlock: async () => {}, play: o => { window.__music = o; return { setIntensity(v) { window.__musicIntensity = v; }, setVolume() {} }; }, sting: n => { window.__sting = n; return Promise.resolve(); } },
  input: {
    track(target) {
      const t = { x: 0, y: 0, down: false, primary: null };
      t.primary = t;
      const pos = e => { const r = target.getBoundingClientRect(); t.x = e.clientX - r.left; t.y = e.clientY - r.top; };
      target.addEventListener('pointerdown', e => { t.down = true; pos(e); try { target.setPointerCapture(e.pointerId); } catch (er) {} });
      target.addEventListener('pointermove', e => { if (t.down) pos(e); });
      for (const ev of ['pointerup', 'pointercancel']) target.addEventListener(ev, () => { t.down = false; });
      t.frameDone = () => {};
      return t;
    },
    activate(node, fn) { node.addEventListener('click', fn); }
  },
  platform: { error(p) { window.__platformError = p; }, ready() { window.__ready = true; }, start() {}, interact() {}, milestone() {}, fail(p) { window.__failed = p; }, complete() {}, haptic() {}, setScore() {}, emit() {} },
  game: {
    loop(o) { let last = performance.now(); const f = t => { o.update && o.update(Math.min(o.maxDeltaMs || 80, t - last)); o.render && o.render(0); last = t; requestAnimationFrame(f); }; requestAnimationFrame(f); return {}; },
    score() { let v = 0; return { set: x => { v = x; window.__score = x; }, reset: () => { v = 0; }, submit: async (ch, o) => { window.__submitted = (window.__submitted || 0) + 1; return { ok: true }; }, leaderboard: async () => (location.search.includes('board') ? { rows: [{ rank: 1, value: 2410 }, { rank: 2, value: 1980 }, { rank: 3, value: 1500 }], viewerRank: { rank: 7, value: window.__score } } : { rows: [{ rank: 1, value: window.__score }], viewerRank: { rank: 1, value: window.__score } }), get value() { return v; } }; }
  }
};
window.__ctx = ctx;
window.plethoraBit.init(ctx).catch(e => { console.error(e); window.__initError = String(e && e.stack || e); });
</script>
</body>
</html>
