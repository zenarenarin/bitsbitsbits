<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EGG DROP dev harness</title>
<style>
  html,body{margin:0;height:100%;background:#222;overflow:hidden}
  #bit{position:absolute;inset:0;overflow:hidden;touch-action:none}
</style>
</head>
<body>
<div id="bit"></div>
<script>window.__EGG_DEV = true;</script>
<script src="../main.js"></script>
<script>
// A small stand-in for the Plethora runtime, covering only what EGG DROP uses.
const host = document.getElementById('bit');
const store = {};
const events = window.__events = [];
const q = new URLSearchParams(location.search);
const dpr = Math.min(2, window.devicePixelRatio || 1);
const safe = { top: +(q.get('top') || 59), right: 0, bottom: +(q.get('bottom') || 34), left: 0 };
const content = { top: safe.top, right: 0, bottom: safe.bottom + 74, left: 0 };
const canvases = [];
function sizeCanvas(c) { c.width = Math.round(host.clientWidth * dpr); c.height = Math.round(host.clientHeight * dpr); c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); }
const ctx = {
  get width() { return host.clientWidth; },
  get height() { return host.clientHeight; },
  dpr, nativeDpr: window.devicePixelRatio || 1,
  safeArea: safe, contentSafeArea: content,
  capabilities: { audio: true, backgroundMusic: true, haptics: true, storage: true, motion: q.has('motion') },
  container: host,
  createCanvas2D(opts) { const c = document.createElement('canvas'); c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;touch-action:none'; host.appendChild(c); sizeCanvas(c); canvases.push(c); return c; },
  createRoot(opts) { const d = document.createElement('div'); d.className = (opts && opts.className) || ''; d.style.cssText = 'position:absolute;inset:0;pointer-events:none'; host.appendChild(d); return d; },
  listen(t, ev, fn, o) { t.addEventListener(ev, fn, o); },
  onResize(cb, o) { const f = () => { canvases.forEach(sizeCanvas); cb({ width: ctx.width, height: ctx.height }); }; window.addEventListener('resize', f); if (o && o.immediate) f(); },
  timeout(fn, ms) { setTimeout(fn, ms); },
  onDestroy(fn) {},
  markVisualReady(r) { window.__visualReady = r; },
  async loadScript(name, version) { if (q.has('fail') && !window.__failedOnce) { window.__failedOnce = true; throw new Error('simulated download failure'); } await new Promise((res, rej) => { const s = document.createElement('script'); s.src = './vendor/planck.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); },
  async loadFont() { return null; },
  input: { activate(t, fn) { t.addEventListener('click', fn); } },
  storage: { get: k => (k in store ? JSON.parse(store[k]) : null), set: (k, v) => { store[k] = JSON.stringify(v); } },
  music: { unlock: async () => {}, play: (o) => { events.push(['music.play', o]); return {}; }, setIntensity: (v) => events.push(['music.intensity', v]), setVolume() {}, duck() {}, stop() {}, sting: (n) => { events.push(['sting', n]); return Promise.resolve(); } },
  motion: { async start() { if (!q.has('motionok')) throw new Error('denied'); }, tiltControl() { return window.__tilt = { x: 0 }; }, calibrate() {} },
  pulse: { complete: (o) => events.push(['pulse', o]) },
  tune: { number: () => undefined },
  platform: { error(p) { events.push(['error', p]); window.__platformError = p; }, ready() { window.__ready = true; events.push(['ready']); }, start(p) { events.push(['start', p]); }, interact(p) { events.push(['interact', p]); }, milestone(n) { events.push(['milestone', n]); }, fail(p) { events.push(['fail', p]); }, complete() {}, haptic(k) { events.push(['haptic', k]); } },
  game: {
    loop(o) {
      let last = performance.now(), acc = 0; const step = 1000 / o.fixedHz;
      window.__loopStep = (ms) => { acc += ms; let n = 0; while (acc >= step && n < o.maxSubsteps) { o.fixedUpdate(step); acc -= step; n++; } if (n >= o.maxSubsteps) acc = 0; o.update && o.update(ms); o.render && o.render(acc / step); };
      const f = t => { if (!window.__manual) window.__loopStep(Math.min(o.maxDeltaMs || 100, t - last)); last = t; requestAnimationFrame(f); }; requestAnimationFrame(f); return {};
    },
    score(id, opt) { let v = 0; return { set: x => { v = x; }, reset: () => { v = 0; }, submit: async (ch, o) => { events.push(['submit', ch, v, o]); return { ok: true }; }, leaderboard: async (ch, o) => { events.push(['board', ch, o]); await new Promise(r => setTimeout(r, 300)); return { rows: [{ rank: 1, username: 'marigold', value: 84200 }, { rank: 2, username: 'quill', value: 61300 }, { rank: 3, username: 'you', value: v, userId: 'me' }], viewerRank: { rank: 3, userId: 'me' }, totalRanked: 41 }; }, get value() { return v; } }; }
  }
};
window.__ctx = ctx;
window.plethoraBit.init(ctx).catch(e => { console.error(e); window.__initError = String(e && e.stack || e); });
</script>
</body>
</html>
